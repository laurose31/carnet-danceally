<body>
<section id="vue-liste" class="ecran">
<header class="barre"><h1>Carnet <em>DanceAlly</em></h1></header>
<div class="defile">
<button class="nouveau" id="nouveau" type="button"><span>+</span> Noter un cours</button>
<div id="liste"></div>
<div class="envoi" id="bloc-envoi">
<strong>Envoyer vers DanceAlly</strong>
<p id="envoi-texte"></p>
<div class="rang">
<button class="bouton plein petit" id="envoyer" type="button">Partager le fichier</button>
<button class="bouton petit" id="copier" type="button">Copier le texte</button>
</div>
<textarea id="texte-copie" class="texte-copie" readonly hidden></textarea>
</div>
</div>
</section>
<section id="vue-cours" class="ecran" hidden>
<header class="barre">
<button class="icone" id="retour" type="button" aria-label="Retour à la liste">←</button>
<h1 id="cours-titre">Cours</h1>
<span class="etat" id="cours-etat"></span>
</header>
<div class="infos">
<div id="infos-detail" class="infos-detail" style="display:grid;gap:8px">
<input id="f-titre" class="titre" placeholder="Titre (facultatif)" autocomplete="off">
<div class="deux">
<input id="f-date" type="date" aria-label="Date du cours">
<input id="f-heure" type="time" aria-label="Heure du cours">
</div>
<input id="f-lieu" placeholder="Lieu ou festival" autocomplete="off" list="lieux-connus">
<datalist id="lieux-connus"></datalist>
<input id="f-prof" placeholder="Prof(s)" autocomplete="off" list="profs-connus">
<datalist id="profs-connus"></datalist>
<div class="puces" id="f-danse" role="group" aria-label="Danse"></div>
<div class="puces" id="f-niveau" role="group" aria-label="Niveau du cours"></div>
</div>
<div class="resume" id="infos-resume" hidden></div>
<button class="replier" id="replier" type="button">Replier</button>
</div>
<div class="defile" id="defile-cours">
<div class="lignes" id="lignes"></div>
<div class="aide" id="aide">
<p><strong>Écris comme ça vient.</strong> Une idée par ligne : la touche Entrée l'ajoute.</p>
<p>Choisis d'abord ce que c'est (exercice, pas, principe…) ou laisse « Note » et trie plus tard.</p>
<p>Le micro du clavier marche aussi pour dicter.</p>
</div>
<div class="videos">
<div class="intertitre">Vidéos récap</div>
<div id="videos-liste" class="cartes"></div>
<div class="video-form" id="video-form" hidden>
<button class="bouton plein petit" id="video-galerie" type="button">Choisir dans la galerie</button>
<input id="video-fichier" type="file" accept="video/*" hidden>
<input id="video-lien" type="url" placeholder="ou coller un lien (Drive, YouTube…)" autocomplete="off">
<input id="video-note" placeholder="Ce qu'on y voit (facultatif)" autocomplete="off">
<div class="rang"><button class="bouton petit" id="video-annuler" type="button">Annuler</button><button class="bouton plein petit" id="video-ok" type="button">Lier</button></div>
</div>
<button class="replier" id="video-ajouter" type="button">+ Lier une vidéo récap</button>
</div>
<div class="pied">
<button class="bouton petit" id="encodee" type="button">Marquer comme encodé</button>
<button class="bouton danger petit" id="supprimer" type="button">Supprimer ce cours</button>
</div>
</div>
<div class="saisie">
<div class="bandeau" id="bandeau-detail" hidden><span>Détails de <strong id="detail-de"></strong></span><button class="bouton plein petit" id="detail-fini" type="button">Terminé</button></div>
<div class="puces" id="types" role="group" aria-label="Type de la prochaine ligne"></div>
<div class="rang">
<textarea id="entree" rows="1" placeholder="Ce dont je me souviens…" enterkeyhint="send" autocapitalize="sentences"></textarea>
<button class="ajouter" id="ajouter" type="button" aria-label="Ajouter la ligne">↵</button>
</div>
</div>
</section>
<div class="toast" id="toast" role="status" hidden></div>
